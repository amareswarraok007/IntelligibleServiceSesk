<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Smart Helpdesk MVP</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .row { display: flex; gap: 20px; }
    .col { flex: 1; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 6px; }
    textarea { width: 100%; height: 80px; }
    pre { background: #f7f7f7; padding: 10px; max-height: 320px; overflow: auto; }
  </style>
</head>
<body>
  <h2>Smart Helpdesk Ticketing MVP</h2>
  <div class="row">
    <div class="col">
      <h3>Submit Ticket</h3>
      <input id="title" placeholder="Title" style="width:100%"/>
      <textarea id="desc" placeholder="Description"></textarea>
      <button onclick="submitTicket()">Create + Process</button>

      <h3>Tickets</h3>
      <table id="ticketsTable">
        <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Priority</th><th>Team</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="col">
      <h3>Ticket Detail + Agent Trace</h3>
      <pre id="detail">Select a ticket row...</pre>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
